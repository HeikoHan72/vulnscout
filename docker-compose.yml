# Startet den vollständigen VulnScout-Stack mit einem Befehl:
#   api         - die Scan-API (Bandit, pip-audit, Semgrep, LLM-Triage, Bericht)
#   mlflow      - Tracking-Server und Model Registry (liefert das Pre-Filter-Modell)
#   prometheus  - sammelt die Kennzahlen der API über /metrics
#   grafana     - zeigt die Kennzahlen als Dashboard
#
# Die Container finden sich gegenseitig über den Dienstnamen, z. B. http://api:8000.
#
# Alle Ports sind an 127.0.0.1 gebunden: Die Dienste sind nur von diesem
# Rechner erreichbar, nicht aus dem Netzwerk. Das ist wichtig, weil Grafana
# hier ohne Anmeldung läuft und die API ungeschützt Scans startet.

services:
  api:
    build: .
    image: vulnscout:local
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - VULNSCOUT_DB_PATH=/app/data/vulnscout.db
      # Überschreibt bewusst einen etwaigen Wert aus .env: Innerhalb des
      # Containers zeigt "localhost" auf den Container selbst, nicht auf den
      # Host. Der Tracking-Server ist hier nur unter seinem Dienstnamen
      # erreichbar. Ohne diese Zeile findet der Pre-Filter kein Modell und
      # fällt still auf "alles an die LLM-Triage" zurück.
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - vulnscout_data:/app/data
    depends_on:
      - mlflow
    restart: unless-stopped

  mlflow:
    # Nutzt dasselbe Image wie die API, damit Server und Anwendung garantiert
    # dieselbe MLflow-Version verwenden (gepinnt in requirements.txt).
    #
    # --allowed-hosts ist zwingend: MLflow prüft den Host-Header gegen eine
    # Positivliste (Schutz gegen DNS-Rebinding) und erlaubt standardmäßig nur
    # localhost und private IP-Bereiche. Der Dienstname "mlflow:5000", unter
    # dem der API-Container den Server anspricht, fällt nicht darunter und
    # würde mit HTTP 403 abgelehnt - der Pre-Filter liefe dann still ins Leere.
    image: vulnscout:local
    build: .
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////app/mlflow/mlflow.db
      --artifacts-destination /app/mlflow/artifacts
      --serve-artifacts
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      # Veröffentlicht, damit Training und MLflow-UI vom Host aus erreichbar
      # sind: http://localhost:5000
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/app/mlflow
    # Überschreibt den HEALTHCHECK aus dem Dockerfile, der die API auf Port
    # 8000 prüft - hier läuft stattdessen der Tracking-Server auf Port 5000.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.5
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # Einstellungen und Alarmregeln, im Container nur lesbar (:ro).
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Die gesammelten Zeitreihen überleben einen Neustart.
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Ohne Anmeldung, mit Bearbeitungsrechten. Vertretbar nur deshalb,
      # weil Grafana ausschließlich auf 127.0.0.1 lauscht.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vulnscout.json
    volumes:
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/vulnscout.json:/var/lib/grafana/dashboards/vulnscout.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  vulnscout_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
