# Einstellungen für Prometheus.
# Prometheus holt die Kennzahlen der VulnScout-API regelmäßig vom Endpunkt
# /metrics ab ("scrapen") und wertet die Alarmregeln aus.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: vulnscout-api
    # Im Compose-Netzwerk heißt der Dienst "api".
    static_configs:
      - targets: ["api:8000"]
